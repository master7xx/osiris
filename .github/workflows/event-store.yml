name: PostgreSQL event store
on:
  pull_request:
  push:
    branches: [master]
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: osiris
          POSTGRES_PASSWORD: osiris_test_only
          POSTGRES_DB: osiris_events_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U osiris -d osiris_events_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      EVENT_TEST_DATABASE_URL: postgres://osiris:osiris_test_only@localhost:5432/osiris_events_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run src/lib/durable-event-store.test.ts
      - run: docker build -f Dockerfile.collector -t osiris-collector:test .
      - name: Apply migrations from collector image
        run: docker run --rm --network host -e EVENT_DATABASE_URL="$EVENT_TEST_DATABASE_URL" osiris-collector:test npm run events:migrate
