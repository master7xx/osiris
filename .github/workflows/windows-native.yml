name: Windows native

on:
  push:
    branches: [feat/windows-native-debug-overlay]
  pull_request:
    branches: [master]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run doctor
      - run: npm test
      - run: npm run build
      - run: npm run smoke:windows
