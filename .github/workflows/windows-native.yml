name: Windows native

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: windows-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inventory existing lint debt
        continue-on-error: true
        run: node tools/audit-lint.mjs
      - run: npm run doctor
      - run: npm test
      - run: npm run build
      - run: npm run smoke:windows
